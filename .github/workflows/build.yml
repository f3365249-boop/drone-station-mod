name: Build Mod

on: [push, pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-33 build-tools;34.0.0'

    - name: Configure SDK and add d8 to PATH
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        # Находим путь к build-tools и добавляем в PATH для доступа к d8
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | head -n 1)
        echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
        echo "Added to PATH: $BUILD_TOOLS_DIR"

    - name: Build mod jar
      run: |
        chmod +x ./gradlew
        ./gradlew deploy

    - name: Upload built jar file
      uses: actions/upload-artifact@v4
      with:
        name: MindustryMod
        path: build/libs/*.jar