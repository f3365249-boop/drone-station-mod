name: Build Mod

on: [push, pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Mindustry Mod for Android & PC
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
        # Автоматическое принятие лицензий встроенного SDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Установка необходимых компонентов сборки
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-33" || true

        chmod +x ./gradlew
        ./gradlew deploy

    - name: Upload built jar file
      uses: actions/upload-artifact@v4
      with:
        name: MindustryMod
        path: build/libs/*.jar